# Fighters Guild Portal — runs alongside the Fluxer stack, on the same Docker
# network so it can reach `api` and `postgres` directly. Caddy routes
# /portal/* to it (see Caddyfile.snippet).
services:
  portal:
    build: https://github.com/RadSoloCup/fightersguild-portal.git#main
    container_name: fightersguild-portal
    restart: unless-stopped
    env_file: ./portal.env
    networks:
      fluxer:
        aliases: [portal]

networks:
  fluxer:
    external: true
    name: fluxer_fluxer
