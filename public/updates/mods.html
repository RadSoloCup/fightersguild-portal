<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fighters Guild Modpack - Full Mod List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: hsl(214, 32%, 4.4%);
    --bg-1: hsl(213, 38%, 6.2%);
    --bg-2: hsl(213, 34%, 9.2%);
    --bg-3: hsl(213, 32%, 12.4%);
    --text-0: hsl(200, 18%, 95%);
    --text-1: hsl(202, 16%, 82%);
    --text-2: hsl(205, 14%, 61%);
    --text-3: hsl(206, 12%, 46%);
    --link: hsl(189, 92%, 62%);
    --brand: hsl(202, 78%, 47%);
    --cyan: #22d3ee;
    --success: hsl(155, 64%, 44%);
    --border: hsla(200, 55%, 62%, 0.16);
    --border-hi: hsla(192, 85%, 62%, 0.35);
    --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--bg-0); color: var(--text-1); font-family: var(--font); line-height: 1.55; }
  img { max-width: 100%; display: block; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  .top {
    padding: 64px 20px 40px;
    text-align: center;
    background: radial-gradient(ellipse 900px 400px at 50% -20%, hsla(192, 85%, 55%, 0.14), transparent 60%), var(--bg-1);
    border-bottom: 1px solid var(--border);
  }
  .top .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cyan); margin-bottom: 14px; }
  .top h1 { margin: 0; font-size: clamp(30px, 5vw, 46px); font-weight: 900; color: var(--text-0); letter-spacing: -0.01em; }
  .top p { max-width: 560px; margin: 16px auto 0; color: var(--text-2); font-size: 15.5px; }
  .top .back { display: inline-block; margin-top: 22px; font-size: 13.5px; color: var(--link); text-decoration: none; }
  .top .back:hover { text-decoration: underline; }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 36px 0 24px;
  }
  .tab {
    padding: 10px 22px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-2);
    color: var(--text-2);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .tab.active { color: var(--bg-0); background: var(--cyan); border-color: var(--cyan); }

  .search-row { display: flex; gap: 12px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; }
  .search-row input {
    flex: 1;
    min-width: 220px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text-0);
    font-size: 14.5px;
    font-family: var(--font);
  }
  .search-row input:focus { outline: none; border-color: var(--border-hi); }
  .count { font-size: 13.5px; color: var(--text-3); white-space: nowrap; }

  .mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .mcard {
    display: flex;
    gap: 14px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .mcard .logo {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-1);
    object-fit: contain;
    padding: 4px;
  }
  .mcard .logo-fallback {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--bg-1);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3);
    font-size: 15px;
    font-weight: 800;
  }
  .mcard .body { min-width: 0; }
  .mcard .name-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .mcard h3 { margin: 0; font-size: 14.5px; font-weight: 700; color: var(--text-0); }
  .mcard .ver { font-size: 11px; color: var(--text-3); font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .mcard p { margin: 0; font-size: 12.5px; color: var(--text-2); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  .kb-table { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--bg-2); }
  .kb-table table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .kb-table th, .kb-table td { text-align: left; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .kb-table th { color: var(--text-3); font-weight: 700; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; position: sticky; top: 0; background: var(--bg-2); }
  .kb-table tr:last-child td { border-bottom: none; }
  .kb-table td.key { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: var(--cyan); font-weight: 600; white-space: nowrap; }
  .kb-table td.mod { color: var(--text-0); font-weight: 600; }
  .kb-table td.action { color: var(--text-2); }
  .kb-table tbody tr:hover { background: var(--bg-hover, hsla(195,70%,72%,0.04)); }

  .empty { text-align: center; padding: 60px 20px; color: var(--text-3); }

  [hidden] { display: none !important; }

  footer { margin-top: 80px; padding: 40px 20px 60px; text-align: center; border-top: 1px solid var(--border); color: var(--text-3); font-size: 13.5px; }
  footer a { color: var(--link); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

  <div class="top">
    <div class="eyebrow">Fighters Guild Modpack</div>
    <h1>Mods &amp; Keybinds</h1>
    <p>Every mod currently installed in the pack, and every non-default key it uses. Search
    either list below.</p>
    <a class="back" href="/updates/modpack-1-3">&laquo; Back to the Update 1.3 changelog</a>
  </div>

  <div class="wrap">

    <div class="tabs">
      <button class="tab active" data-tab="mods">Mods</button>
      <button class="tab" data-tab="keybinds">Keybinds</button>
    </div>

    <div id="panel-mods">
      <div class="search-row">
        <input type="text" id="mod-search" placeholder="Search mods by name or description...">
        <span class="count" id="mod-count"></span>
      </div>
      <div class="mod-grid" id="mod-grid"></div>
      <div class="empty" id="mod-empty" hidden>No mods match your search.</div>
    </div>

    <div id="panel-keybinds" hidden>
      <div class="search-row">
        <input type="text" id="kb-search" placeholder="Search keybinds by mod, action, or key...">
        <span class="count" id="kb-count"></span>
      </div>
      <div class="kb-table">
        <table>
          <thead><tr><th>Mod</th><th>Action</th><th>Key</th></tr></thead>
          <tbody id="kb-body"></tbody>
        </table>
      </div>
      <div class="empty" id="kb-empty" hidden>No keybinds match your search.</div>
    </div>

  </div>

  <footer>
    Fighters Guild &middot; <a href="/portal">Back to the Portal</a>
  </footer>

<script>
(function () {
  var modGrid = document.getElementById('mod-grid')
  var modEmpty = document.getElementById('mod-empty')
  var modCount = document.getElementById('mod-count')
  var modSearch = document.getElementById('mod-search')
  var kbBody = document.getElementById('kb-body')
  var kbEmpty = document.getElementById('kb-empty')
  var kbCount = document.getElementById('kb-count')
  var kbSearch = document.getElementById('kb-search')

  var mods = []
  var keybinds = []

  function esc(s) {
    var d = document.createElement('div')
    d.textContent = s == null ? '' : s
    return d.innerHTML
  }

  function initials(name) {
    var parts = name.replace(/[^A-Za-z0-9 ]/g, ' ').trim().split(/\s+/)
    return ((parts[0] || '?')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase()
  }

  function renderMods(list) {
    modGrid.innerHTML = list.map(function (m) {
      var logo = m.logo
        ? '<img class="logo" src="mods-assets/' + m.logo + '" alt="" loading="lazy">'
        : '<div class="logo-fallback">' + esc(initials(m.name)) + '</div>'
      return '<div class="mcard">' + logo +
        '<div class="body"><div class="name-row"><h3>' + esc(m.name) + '</h3>' +
        (m.version ? '<span class="ver">' + esc(m.version) + '</span>' : '') + '</div>' +
        '<p>' + esc(m.description || 'No description provided.') + '</p></div></div>'
    }).join('')
    modEmpty.hidden = list.length > 0
    modCount.textContent = list.length + ' mod' + (list.length === 1 ? '' : 's')
  }

  function renderKeybinds(list) {
    kbBody.innerHTML = list.map(function (k) {
      return '<tr><td class="mod">' + esc(k.modName) + '</td><td class="action">' + esc(k.action) + '</td><td class="key">' + esc(k.key) + '</td></tr>'
    }).join('')
    kbEmpty.hidden = list.length > 0
    kbCount.textContent = list.length + ' keybind' + (list.length === 1 ? '' : 's')
  }

  modSearch.addEventListener('input', function () {
    var q = modSearch.value.trim().toLowerCase()
    var filtered = !q ? mods : mods.filter(function (m) {
      return (m.name && m.name.toLowerCase().indexOf(q) !== -1) ||
        (m.description && m.description.toLowerCase().indexOf(q) !== -1)
    })
    renderMods(filtered)
  })

  kbSearch.addEventListener('input', function () {
    var q = kbSearch.value.trim().toLowerCase()
    var filtered = !q ? keybinds : keybinds.filter(function (k) {
      return (k.modName && k.modName.toLowerCase().indexOf(q) !== -1) ||
        (k.action && k.action.toLowerCase().indexOf(q) !== -1) ||
        (k.key && k.key.toLowerCase().indexOf(q) !== -1)
    })
    renderKeybinds(filtered)
  })

  var tabs = document.querySelectorAll('.tab')
  var panels = { mods: document.getElementById('panel-mods'), keybinds: document.getElementById('panel-keybinds') }
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('active') })
      tab.classList.add('active')
      Object.keys(panels).forEach(function (k) { panels[k].hidden = k !== tab.dataset.tab })
    })
  })

  Promise.all([
    fetch('mods-assets/mods-final.json').then(function (r) { return r.json() }),
    fetch('mods-assets/keybinds.json').then(function (r) { return r.json() }),
  ]).then(function (results) {
    mods = results[0]
    keybinds = results[1]
    renderMods(mods)
    renderKeybinds(keybinds)
  }).catch(function (err) {
    modGrid.innerHTML = ''
    modEmpty.hidden = false
    modEmpty.textContent = 'Could not load the mod list right now.'
  })
})()
</script>

</body>
</html>
